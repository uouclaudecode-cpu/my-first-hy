<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UOU SW 공고 모아보기</title>
  <meta name="description" content="울산대 SW 서포터즈가 모은 SW 대외활동·인턴 공고와 울산대 SW 소식" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b5cad'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>SW</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="eyebrow">울산대학교 SW 서포터즈</p>
      <h1>SW 공고 모아보기</h1>
      <p class="lede">SW 대외활동·공모전, 인턴 공고, 울산대 SW 소식을 매시간 모아 보여드려요.</p>
      <p class="updated" id="updated" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="카테고리">
      <button role="tab" data-cat="all">전체 <span class="count"></span></button>
      <button role="tab" data-cat="activity">대외활동 <span class="count"></span></button>
      <button role="tab" data-cat="intern">인턴 <span class="count"></span></button>
      <button role="tab" data-cat="uou_news">울산대 소식 <span class="count"></span></button>
    </nav>

    <div class="controls">
      <label class="search">
        <span class="sr-only">검색</span>
        <input id="q" type="search" placeholder="제목·기관 검색" autocomplete="off" />
      </label>
      <label class="select">
        <span class="sr-only">정렬</span>
        <select id="sort">
          <option value="deadline">마감 임박순</option>
          <option value="deadline_desc">마감 늦은순</option>
          <option value="recent">최신 등록순</option>
        </select>
      </label>
      <label class="toggle">
        <input id="closed" type="checkbox" />
        <span>마감된 공고 포함</span>
      </label>
    </div>

    <p class="status" id="status" role="status"></p>
    <ul class="list" id="list"></ul>
  </main>

  <footer class="wrap foot">
    <p>
      출처: 네이버 검색 API, 고용24 Open API,
      <a href="https://www.saramin.co.kr" target="_blank" rel="noopener">채용정보 제공: 사람인</a>,
      위비티, 콘테스트코리아, 울산대 SW중심대학사업단 공지.
      정확한 내용과 마감일은 반드시 원문에서 확인하세요.
    </p>
  </footer>

  <template id="card">
    <li class="card">
      <div class="meta">
        <span class="chip"></span>
        <span class="dday"></span>
      </div>
      <h2><a target="_blank" rel="noopener noreferrer"></a></h2>
      <p class="org"></p>
      <p class="summary"></p>
      <div class="foot-row">
        <span class="tags"></span>
        <span class="date"></span>
      </div>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
