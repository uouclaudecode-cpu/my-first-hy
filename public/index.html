<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UOU SW 공고 보드</title>
  <meta name="description" content="울산대 SW 서포터즈가 모은 SW 대외활동·인턴 공고와 울산대 SW 소식" />
  <meta name="theme-color" content="#0b4a9e" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b4a9e'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>SW</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="brand"><span class="mark" aria-hidden="true">SW</span>울산대학교 SW 서포터즈</p>
      <h1>SW 공고 보드</h1>
      <p class="lede">SW 대외활동·공모전, 인턴 공고, 울산대 SW 소식을 매시간 모아요.<br class="hide-sm" />
        마음에 드는 공고는 <strong>카드뉴스 복사</strong>로 바로 홍보 자료를 만들 수 있어요.</p>

      <dl class="stats" aria-live="polite">
        <div class="stat"><dt>진행 중</dt><dd id="stat-open">–</dd></div>
        <div class="stat urgent"><dt>마감 임박 <span class="hint">D-3 이내</span></dt><dd id="stat-urgent">–</dd></div>
        <div class="stat"><dt>새로 들어온 <span class="hint">48시간</span></dt><dd id="stat-new">–</dd></div>
        <div class="stat"><dt>마지막 수집</dt><dd id="stat-updated" class="small">–</dd></div>
      </dl>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <nav class="tabs" role="tablist" aria-label="카테고리">
        <button role="tab" data-cat="all">전체 <span class="count"></span></button>
        <button role="tab" data-cat="activity">대외활동 <span class="count"></span></button>
        <button role="tab" data-cat="intern">인턴 <span class="count"></span></button>
        <button role="tab" data-cat="uou_news">울산대 소식 <span class="count"></span></button>
      </nav>
      <div class="controls">
        <label class="search">
          <span class="sr-only">검색</span>
          <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" /><path d="m14 14 4 4" /></svg>
          <input id="q" type="search" placeholder="제목·기관·키워드 검색" autocomplete="off" />
        </label>
        <label class="select">
          <span class="sr-only">정렬</span>
          <select id="sort">
            <option value="deadline">마감 임박순</option>
            <option value="deadline_desc">마감 늦은순</option>
            <option value="recent">최신 등록순</option>
          </select>
        </label>
        <label class="toggle">
          <input id="closed" type="checkbox" />
          <span>마감 포함</span>
        </label>
      </div>
    </div>
  </div>

  <main class="wrap">
    <p class="status" id="status" role="status"></p>
    <ul class="grid" id="list" aria-busy="true"></ul>
  </main>

  <footer class="wrap foot">
    <p>
      출처: 네이버 검색 API, 고용24 Open API,
      <a href="https://www.saramin.co.kr" target="_blank" rel="noopener">채용정보 제공: 사람인</a>,
      위비티, 콘테스트코리아, 울산대 SW중심대학사업단 공지, 서포터즈 직접 추가.
      정확한 내용과 마감일은 반드시 원문에서 확인하세요.
    </p>
  </footer>

  <div class="selbar" id="selbar" hidden>
    <div class="selbar-inner">
      <span><strong id="sel-count">0</strong>개 선택</span>
      <button type="button" class="btn primary" id="sel-copy">모음 카드뉴스 요청 복사</button>
      <button type="button" class="btn ghost" id="sel-clear">선택 해제</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="card">
    <li class="card">
      <div class="card-top">
        <span class="chip"></span>
        <span class="src"></span>
        <span class="new" hidden>NEW</span>
        <label class="pick" title="모음 카드뉴스에 담기">
          <input type="checkbox" />
          <span class="sr-only">모음 카드뉴스에 담기</span>
        </label>
      </div>
      <h2><a target="_blank" rel="noopener noreferrer"></a></h2>
      <p class="org"></p>
      <p class="summary"></p>
      <ul class="tags"></ul>
      <div class="card-bottom">
        <div class="due">
          <span class="dday"></span>
          <span class="date"></span>
        </div>
        <div class="actions">
          <button type="button" class="btn copy">카드뉴스 복사</button>
          <a class="btn ghost open" target="_blank" rel="noopener noreferrer">원문</a>
        </div>
      </div>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
