<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>글 보관함</title>
  <meta name="description" content="AI가 공고로 쓴 블로그·인스타그램 글 보관함" />
  <meta name="theme-color" content="#0b4a9e" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b4a9e'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>SW</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .hero.slim { padding: 28px 0 22px; }
    .back { color: #fff; opacity: 0.85; font-size: 14px; text-decoration: none; }
    .back:hover { opacity: 1; text-decoration: underline; }
    .posts { list-style: none; margin: 0; padding: 20px 0 0; display: grid; gap: 14px; }
    .post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 10px; }
    .post-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .kind { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); }
    .kind.weekly { background: var(--intern-soft); color: var(--intern); }
    .post-meta .del { margin-left: auto; color: var(--faint); }
    .post-meta .del:hover { color: var(--urgent); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .post-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; word-break: keep-all; }
    .post-title::after { content: ' ▾'; color: var(--faint); font-size: 13px; }
    details[open] .post-title::after { content: ' ▴'; }
    details[open] > summary { margin-bottom: 10px; }
  </style>
</head>
<body>
  <header class="hero slim">
    <div class="wrap">
      <a class="back" href="/">← 공고 보드로</a>
      <h1 style="margin-top:10px">📚 글 보관함</h1>
      <p class="lede">AI가 공고로 쓴 블로그 글과 인스타그램 캡션이 모여 있어요. 매주 월요일 아침에는 "이번 주 SW 공고 모음"이 자동으로 올라와요.</p>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="status" role="status">불러오는 중…</p>
    <ul class="posts" id="posts"></ul>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="posts.js" type="module"></script>
</body>
</html>
